<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Eya Gharbi</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/iconP.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <meta name="description" content="Eya GHARBI — Développeuse Full Stack Angular · Spring Boot · NestJS">
  <meta name="theme-color" content="#0f172a">
  <script>
    // GitHub Pages SPA: restore the path saved by 404.html
    (function() {
      var params = new URLSearchParams(window.location.search);
      var p = params.get('p');
      var h = params.get('h');
      if (p) {
        window.history.replaceState(
          null, null,
          '/eya.gharbi.github.io' + decodeURIComponent(p) +
          (h ? decodeURIComponent(h) : '')
        );
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
