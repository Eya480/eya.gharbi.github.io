<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MonPortfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/iconP.jpg">
  <script>
    // GitHub Pages SPA: restore the path saved by 404.html
    (function() {
      var params = new URLSearchParams(window.location.search);
      var p = params.get('p');
      var h = params.get('h');
      if (p) {
        window.history.replaceState(
          null, null,
          '/eya.gharbi.github.io' + decodeURIComponent(p) +
          (h ? decodeURIComponent(h) : '')
        );
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
