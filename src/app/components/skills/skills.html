<section id="skills" class="skills-section section-padding">
  <div class="container">
    <div class="section-header text-center mb-4">
      <h2 class="section-title">Mes Compétences</h2>
      <p class="section-subtitle">Un aperçu de mes compétences techniques et professionnelles</p>
      <div class="section-divider"></div>
    </div>

    <!-- Grille des compétences techniques - Compacte -->
    <div class="row g-3">
      <div class="col-lg-4 col-md-6 col-sm-12" *ngFor="let category of categories">
        <div class="skill-category-card">
          <div class="skill-category-header">
            <i class="skill-category-icon" [class]="getCategoryIcon(category)"></i>
            <h4 class="skill-category-title">{{ getCategoryTitle(category) }}</h4>
          </div>
          
          <div class="skill-items">
            <div class="skill-item" *ngFor="let skill of getSkillsByCategory(skills$ | async, category)">
              <div class="skill-info">
                <div class="skill-name-container">
                  <i *ngIf="skill.icon" [class]="skill.icon + ' skill-icon'"></i>
                  <span class="skill-name">{{ skill.name }}</span>
                </div>
                <span class="skill-level">{{ skill.level }}%</span>
              </div>
              
              <div class="progress skill-progress">
                <div 
                  class="progress-bar" 
                  [ngClass]="getProgressBarClass(skill.category)"
                  [style.width.%]="skill.level"
                  role="progressbar"
                  [attr.aria-valuenow]="skill.level"
                  aria-valuemin="0"
                  aria-valuemax="100">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Compétences soft - Compactes -->
    <div class="row mt-4">
      <div class="col-12">
        <div class="soft-skills-section">
          <h3 class="text-center mb-3">Compétences Professionnelles</h3>
          <div class="row g-2 justify-content-center">
            <div class="col-lg-2 col-md-3 col-sm-4 col-6" *ngFor="let softSkill of softSkills">
              <div class="soft-skill-card text-center">
                <i [class]="softSkill.icon"></i>
                <h5>{{ softSkill.name }}</h5>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
