<nav class="navbar navbar-expand-lg fixed-top" [class.navbar-scrolled]="isScrolled">
  <div class="container">
    <a class="navbar-brand" (click)="goToHome()" style="cursor: pointer;">
      <span class="brand-text">MonPortfolio</span>
    </a>

    <button 
      class="navbar-toggler" 
      type="button" 
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="navbar-collapse collapse" [class.show]="isMenuOpen">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item" *ngFor="let item of navItems">
          <a 
            class="nav-link" 
            [class.active]="isActive(item.id)"
            (click)="navigateTo(item)"
            style="cursor: pointer;">
            <i [class]="item.icon + ' me-2'"></i>
            {{ item.label }}
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Barre de progression du scroll -->
<div class="nav-scroll-progress" [style.width.%]="getScrollProgress()"></div>
