<section id="home" class="hero-section">

  <!-- Background -->
  <div class="hero-background">
    <div class="particles-container"></div>
    <div class="gradient-overlay"></div>
  </div>

  <div class="container">
    <div class="hero-grid">

      <!-- ── Colonne texte ───────────────────────────────────────── -->
      <div class="hero-content" [class.fade-in]="showContent">

        <!-- Badge statut -->
        <div class="status-badge">
          <span class="badge-dot"></span>
          <span class="badge-text">Disponible pour de nouvelles opportunités</span>
        </div>

        <!-- Nom -->
        <h1 class="hero-title">
          <span class="text-highlight">Eya GHARBI</span>
        </h1>


        <!-- Typing -->
        <div class="hero-subtitle">
          <span class="typed-text">{{ typedText }}</span><span class="cursor">|</span>
        </div>

        <!-- CTAs -->
        <div class="hero-actions">
          <a href="assets/cv_EyaGHARBI.pdf" download class="btn btn-primary">
            <span class="btn-content">
              <i class="fas fa-download"></i>
              Télécharger CV
            </span>
          </a>
          <button class="btn btn-outline-light" (click)="scrollTo('contact')">
            <span class="btn-content">
              <i class="fas fa-paper-plane"></i>
              Me contacter
            </span>
          </button>
        </div>

        <!-- Réseaux sociaux -->
        <div class="hero-social">
          <span class="social-label">Profils :</span>
          <div class="social-links">
            <a href="https://github.com/Eya480" target="_blank" class="social-link" aria-label="GitHub">
              <i class="fab fa-github"></i>
            </a>
            <a href="https://www.linkedin.com/in/eyaelgharbi/" target="_blank" class="social-link" aria-label="LinkedIn">
              <i class="fab fa-linkedin"></i>
            </a>
            <a href="mailto:eya.elgharbi.pro@gmail.com" class="social-link" aria-label="Email">
              <i class="fas fa-envelope"></i>
            </a>
          </div>
        </div>

      </div><!-- /hero-content -->

      <!-- ── Colonne image ───────────────────────────────────────── -->
      <div class="hero-image-container" [class.fade-in]="showContent">
        <div class="image-wrapper" [class.loaded]="imageLoaded">
          <img
            src="assets/profile.png"
            alt="Eya GHARBI — Développeuse Full Stack"
            class="hero-image"
            (load)="onImageLoad()"
            loading="eager"
          />

          <!-- Badges tech flottants -->
          <div class="tech-badge angular-badge">
            <i class="fab fa-angular"></i>
            <span>Angular</span>
          </div>
          <div class="tech-badge nestjs-badge">
            <i class="fas fa-server"></i>
            <span>NestJS</span>
          </div>
          <div class="tech-badge nextjs-badge">
            <i class="fab fa-react"></i>
            <span>Next.js</span>
          </div>
        </div>
      </div><!-- /hero-image-container -->

    </div><!-- /hero-grid -->
  </div><!-- /container -->

  <!-- Scroll indicator -->
  <div class="scroll-indicator" (click)="scrollTo('about')">
    <div class="scroll-arrow"><i class="fas fa-chevron-down"></i></div>
    <span class="scroll-text">Scroll</span>
  </div>

</section>
